<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MixO Store | Premium Streetwear & Mobile Accessories</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0284c7',
                            900: '#0c4a6e',
                            accent: '#f43f5e'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & Lucide Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col antialiased selection:bg-rose-500 selection:text-white">

    <!-- Top Announcement Bar -->
    <div class="bg-gradient-to-r from-rose-600 via-purple-600 to-sky-600 text-white text-xs py-2 px-4 text-center font-medium tracking-wide">
        🚀 FREE SHIPPING ON ORDERS OVER $75 • USE CODE <span class="font-bold underline">MIXO15</span> FOR 15% OFF
    </div>

    <!-- Main Navigation Bar -->
    <header class="sticky top-0 z-40 bg-zinc-950/80 backdrop-blur-md border-b border-zinc-800/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
            <!-- Brand Logo -->
            <a href="#" class="flex items-center gap-2 text-2xl font-black tracking-tighter uppercase text-white group">
                <span class="w-9 h-9 rounded-xl bg-gradient-to-tr from-rose-500 to-sky-500 flex items-center justify-center text-white font-black shadow-lg shadow-rose-500/20 group-hover:scale-105 transition-transform">M</span>
                <span>MixO <span class="text-rose-500 font-light">Store</span></span>
            </a>

            <!-- Search Bar -->
            <div class="hidden md:flex flex-1 max-w-md mx-8 relative">
                <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-400"></i>
                <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Search apparel, magsafe cases, charger hubs..." class="w-full bg-zinc-900 border border-zinc-800 rounded-full pl-10 pr-4 py-2 text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-rose-500 transition-colors">
            </div>

            <!-- Header Actions -->
            <div class="flex items-center gap-3">
                <!-- Currency Selector -->
                <select id="currencySelect" onchange="changeCurrency(this.value)" class="bg-zinc-900 border border-zinc-800 rounded-lg text-xs font-semibold px-2.5 py-2 text-zinc-300 focus:outline-none focus:border-rose-500">
                    <option value="USD">$ USD</option>
                    <option value="EUR">€ EUR</option>
                    <option value="GBP">£ GBP</option>
                </select>

                <!-- Wishlist Button -->
                <button onclick="toggleWishlistModal()" class="p-2.5 rounded-full bg-zinc-900 border border-zinc-800 text-zinc-300 hover:text-white hover:border-zinc-700 transition relative">
                    <i data-lucide="heart" class="w-5 h-5"></i>
                    <span id="wishlistCount" class="absolute -top-1 -right-1 w-5 h-5 bg-rose-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center">0</span>
                </button>

                <!-- Cart Button -->
                <button onclick="toggleCartDrawer()" class="p-2.5 rounded-full bg-rose-600 text-white hover:bg-rose-500 transition relative shadow-lg shadow-rose-600/20">
                    <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                    <span id="cartCount" class="absolute -top-1 -right-1 w-5 h-5 bg-white text-zinc-950 text-[10px] font-extrabold rounded-full flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow">
        <!-- Hero Section -->
        <section class="relative overflow-hidden py-16 lg:py-24 border-b border-zinc-800/60 bg-gradient-to-b from-zinc-900/50 to-zinc-950">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                <div class="max-w-2xl">
                    <span class="px-3 py-1 rounded-full text-xs font-bold tracking-wider uppercase bg-rose-500/10 text-rose-400 border border-rose-500/20 inline-block mb-4">New Season Drop 2026</span>
                    <h1 class="text-4xl sm:text-6xl font-black tracking-tight text-white leading-none mb-6">
                        STREETWEAR &amp; <br><span class="text-transparent bg-clip-text bg-gradient-to-r from-rose-500 via-purple-400 to-sky-400">TECH GEAR.</span>
                    </h1>
                    <p class="text-lg text-zinc-400 mb-8 max-w-lg leading-relaxed">
                        Elevate your aesthetic. Shop engineered mobile gear and heavyweight streetwear built for urban lifestyle.
                    </p>
                    <div class="flex
